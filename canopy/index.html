<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canopy — Environmental Journalism Toolkit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#0A140F;
    --canopy-deep:#122A1D;
    --canopy-mid:#1B3D28;
    --canopy-panel:#204731;
    --moss:#3D6B4F;
    --fern:#8FB89B;
    --fern-dim:#5C8770;
    --brass:#C9A24B;
    --brass-bright:#E4C476;
    --clay:#B5613F;
    --paper:#EFE9D8;
    --paper-dim:#B9C4B9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }
  html{scroll-behavior:smooth;}
  body{
    background:var(--canopy-deep);
    color:var(--paper);
    font-family:'Manrope', sans-serif;
    overflow-x:hidden;
    line-height:1.6;
  }
  a{color:inherit;}
  ::selection{background:var(--brass); color:var(--void);}

  /* ================= HERO ================= */
  .hero{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:2rem 6vw;
    overflow:hidden;
  }
  .canopy-layers{position:absolute; inset:0; z-index:0; pointer-events:none;}
  .leaf-layer{
    position:absolute;
    border-radius:50%;
    filter:blur(60px);
    opacity:0.55;
    will-change:transform;
  }
  .leaf-1{width:60vw; height:60vw; top:-20%; left:-15%; background:radial-gradient(circle, var(--moss), transparent 70%);}
  .leaf-2{width:45vw; height:45vw; top:30%; right:-10%; background:radial-gradient(circle, var(--canopy-panel), transparent 70%);}
  .leaf-3{width:35vw; height:35vw; bottom:-15%; left:20%; background:radial-gradient(circle, var(--brass), transparent 75%); opacity:0.18;}

  .eyebrow{
    position:relative; z-index:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--fern);
    margin-bottom:1.2rem;
  }
  .kinetic-title{
    position:relative; z-index:1;
    font-family:'Fraunces', serif;
    font-weight:900;
    font-size:clamp(4rem, 15vw, 11rem);
    line-height:0.85;
    letter-spacing:-0.02em;
    display:flex;
    flex-wrap:wrap;
    color:var(--paper);
  }
  .kinetic-title .letter{
    display:inline-block;
    opacity:0;
    transform:translateY(0.6em) rotate(3deg);
    animation:letterRise 0.8s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes letterRise{
    to{opacity:1; transform:translateY(0) rotate(0);}
  }
  .hero-sub{
    position:relative; z-index:1;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size:clamp(1.1rem, 2.4vw, 1.6rem);
    color:var(--paper-dim);
    max-width:36ch;
    margin-top:1.6rem;
  }
  .hero-sub .word{
    display:inline-block;
    opacity:0;
    transform:translateY(0.4em);
    animation:wordRise 0.6s ease forwards;
  }
  @keyframes wordRise{ to{opacity:1; transform:translateY(0);} }

  .scroll-cue{
    position:absolute;
    bottom:2.4rem; left:6vw;
    z-index:1;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--fern-dim);
    display:flex; align-items:center; gap:0.5rem;
  }
  .scroll-cue::after{
    content:'';
    width:1px; height:24px;
    background:var(--fern-dim);
    animation:scrollPulse 1.6s ease-in-out infinite;
  }
  @keyframes scrollPulse{ 0%,100%{opacity:0.3;} 50%{opacity:1;} }

  /* ================= BENTO SECTION ================= */
  .bento-section{padding:4rem 6vw 8rem;}
  .section-kinetic{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(2.2rem, 6vw, 3.8rem);
    color:var(--paper);
    opacity:0;
    transform:translateY(20px);
    transition:opacity 0.7s ease, transform 0.7s ease;
    margin-bottom:2rem;
  }
  .section-kinetic.is-visible{opacity:1; transform:translateY(0);}

  .module-layout{
    display:grid;
    grid-template-columns:1fr;
    gap:1.5rem;
    align-items:start;
  }
  @media (min-width:900px){
    .module-layout{
      grid-template-columns:minmax(300px, 380px) 1fr;
      gap:2rem;
    }
  }

  .bento-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:1.1rem;
  }
  .bento-tile{
    width:100%;
    grid-column:span 1;
    background:var(--canopy-mid);
    border:1px solid var(--moss);
    border-radius:4px;
    position:relative;
    overflow:hidden;
    text-align:left;
    cursor:pointer;
    color:var(--paper);
    font:inherit;
    padding:1.8rem;
    display:flex;
    flex-direction:column;
    gap:1rem;
    min-height:220px;
    transition:transform 0.25s cubic-bezier(.2,.8,.2,1), border-color 0.25s ease, background 0.25s ease;
  }
  @media (max-width:560px){
    .bento-tile{padding:1.4rem; min-height:0;}
  }
  @media (min-width:900px){
    .bento-tile{min-height:180px;}
  }
  .bento-tile::before{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(201,162,75,0.08), transparent 60%);
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .bento-tile:hover, .bento-tile:focus-visible{
    transform:translateY(-4px);
    border-color:var(--brass);
    background:var(--canopy-panel);
  }
  .bento-tile:hover::before, .bento-tile:focus-visible::before{opacity:1;}
  .bento-tile.is-active{border-color:var(--brass-bright); background:var(--canopy-panel);}

  .tile-top{
    display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center;
    gap:0.5rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--fern);
    position:relative; z-index:1;
  }
  .tile-progress{
    padding:0.2rem 0.55rem;
    border:1px solid var(--fern-dim);
    border-radius:20px;
    font-size:0.65rem;
    white-space:nowrap;
  }
  .tile-title{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:clamp(1.3rem, 2.6vw, 2rem);
    line-height:1.15;
    position:relative; z-index:1;
    overflow-wrap:break-word;
  }
  .tile-desc{
    font-size:0.92rem;
    color:var(--paper-dim);
    max-width:48ch;
    position:relative; z-index:1;
    overflow-wrap:break-word;
  }
  .tile-body{position:relative; z-index:1;}
  .tile-cta{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--brass-bright);
    display:flex; align-items:center; gap:0.4rem;
    position:relative; z-index:1;
  }
  .tile-cta .chevron{transition:transform 0.25s ease;}
  .bento-tile.is-active .tile-cta .chevron{transform:rotate(90deg);}

  /* ---- Mobile inline per-tile panel (accordion) ---- */
  .inline-panel{
    display:grid;
    grid-template-rows:0fr;
    background:var(--canopy-mid);
    border:1px solid var(--moss);
    border-top:none;
    border-left:4px solid var(--brass);
    border-radius:0 0 4px 4px;
    transition:grid-template-rows 0.4s cubic-bezier(.2,.8,.2,1);
  }
  .inline-panel.is-open{grid-template-rows:1fr;}
  .inline-inner{overflow:hidden; min-height:0;}
  .inline-content{padding:1.6rem 1.4rem;}
  @media (min-width:900px){
    .inline-panel{display:none !important;}
  }

  /* ---- Desktop persistent side panel ---- */
  .module-sidepanel{
    display:none;
  }
  @media (min-width:900px){
    .module-sidepanel{
      display:block;
      position:sticky;
      top:2rem;
      background:var(--canopy-mid);
      border:1px solid var(--moss);
      border-left:4px solid var(--brass);
      border-radius:4px;
      padding:2rem 1.8rem;
      max-height:calc(100vh - 4rem);
      overflow-y:auto;
    }
  }
  .sidepanel-empty{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.85rem;
    color:var(--fern-dim);
    font-style:italic;
  }

  /* ---- Shared register content (used inside both inline-content and sidepanel-content) ---- */
  .dossier-head{
    display:flex; align-items:baseline; gap:1rem; flex-wrap:wrap;
    border-bottom:1px solid var(--moss);
    padding-bottom:1rem; margin-bottom:1.6rem;
  }
  .dossier-num{font-family:'IBM Plex Mono', monospace; color:var(--brass-bright); font-size:0.9rem;}
  .dossier-title{font-family:'Fraunces', serif; font-weight:700; font-size:1.5rem; flex:1;}

  .chapter-block{margin-bottom:1.6rem;}
  .chapter-name{
    font-family:'IBM Plex Mono', monospace; font-size:0.68rem; text-transform:uppercase;
    letter-spacing:0.06em; color:var(--fern-dim); margin-bottom:0.6rem;
    border-bottom:1px dashed var(--moss); padding-bottom:0.3rem;
  }
  .mod-row{
    display:grid;
    grid-template-columns:56px 1fr auto auto;
    align-items:center;
    gap:0.8rem;
    padding:0.55rem 0.4rem;
    border-radius:3px;
    text-decoration:none;
    color:var(--paper);
    transition:background 0.15s ease;
  }
  a.mod-row:hover{background:rgba(201,162,75,0.08);}
  .mod-code{font-family:'IBM Plex Mono', monospace; font-size:0.74rem; color:var(--brass);}
  .mod-title{font-size:0.94rem;}
  .mod-level{font-family:'IBM Plex Mono', monospace; font-size:0.6rem; text-transform:uppercase; color:var(--fern-dim); justify-self:end;}
  .mod-status{
    font-family:'IBM Plex Mono', monospace; font-size:0.62rem; text-transform:uppercase;
    padding:0.15rem 0.5rem; border-radius:20px; justify-self:end; white-space:nowrap;
  }
  .status-filed{color:var(--brass-bright); border:1px solid var(--brass-bright);}
  .status-pending{color:var(--fern-dim); border:1px dashed var(--fern-dim);}
  @media (max-width:600px){
    .mod-row{grid-template-columns:44px 1fr; row-gap:0.3rem;}
    .mod-level, .mod-status{grid-column:2; justify-self:start;}
  }

  footer{
    padding:2.4rem 6vw 3rem;
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--fern-dim);
    border-top:1px solid var(--canopy-panel);
  }

  a:focus-visible, button:focus-visible{outline:2px solid var(--brass-bright); outline-offset:2px;}
</style>
</head>
<body>

<section class="hero">
  <div class="canopy-layers" aria-hidden="true">
    <div class="leaf-layer leaf-1" data-speed="0.15"></div>
    <div class="leaf-layer leaf-2" data-speed="0.3"></div>
    <div class="leaf-layer leaf-3" data-speed="0.45"></div>
  </div>
  <p class="eyebrow">Environmental Journalism Toolkit</p>
  <h1 class="kinetic-title" id="kineticTitle" aria-label="Canopy"></h1>
  <p class="hero-sub" id="heroSub"></p>
  <div class="scroll-cue">Scroll</div>
</section>

<section class="bento-section">
  <h2 class="section-kinetic">The Modules</h2>

  <div class="module-layout">
    <div class="bento-grid" id="bentoGrid">
      <div class="module-item">
        <button class="bento-tile" data-pillar="1">
          <div class="tile-top"><span>Module 1</span><span class="tile-progress">20 Sub-Modules</span></div>
          <div class="tile-body">
            <h3 class="tile-title">Core Craft &amp; Storytelling</h3>
            <p class="tile-desc">What makes an environmental story worth telling, and how to tell it well.</p>
          </div>
          <span class="tile-cta">View modules <span class="chevron">›</span></span>
        </button>
        <div class="inline-panel" id="inline-1"><div class="inline-inner"><div class="inline-content"></div></div></div>
      </div>

      <div class="module-item">
        <button class="bento-tile" data-pillar="2">
          <div class="tile-top"><span>Module 2</span><span class="tile-progress">13 Sub-Modules</span></div>
          <div class="tile-body">
            <h3 class="tile-title">Story Ideas &amp; Beats</h3>
            <p class="tile-desc">Where the stories on this beat actually live.</p>
          </div>
          <span class="tile-cta">View modules <span class="chevron">›</span></span>
        </button>
        <div class="inline-panel" id="inline-2"><div class="inline-inner"><div class="inline-content"></div></div></div>
      </div>

      <div class="module-item">
        <button class="bento-tile" data-pillar="3">
          <div class="tile-top"><span>Module 3</span><span class="tile-progress">15 Sub-Modules</span></div>
          <div class="tile-body">
            <h3 class="tile-title">Data &amp; Investigative Methods</h3>
            <p class="tile-desc">Turning datasets, satellites, and documents into stories.</p>
          </div>
          <span class="tile-cta">View modules <span class="chevron">›</span></span>
        </button>
        <div class="inline-panel" id="inline-3"><div class="inline-inner"><div class="inline-content"></div></div></div>
      </div>

      <div class="module-item">
        <button class="bento-tile" data-pillar="4">
          <div class="tile-top"><span>Module 4</span><span class="tile-progress">8 Sub-Modules</span></div>
          <div class="tile-body">
            <h3 class="tile-title">Bangladesh Context</h3>
            <p class="tile-desc">Who governs what, and where the reference data lives.</p>
          </div>
          <span class="tile-cta">View modules <span class="chevron">›</span></span>
        </button>
        <div class="inline-panel" id="inline-4"><div class="inline-inner"><div class="inline-content"></div></div></div>
      </div>

      <div class="module-item">
        <button class="bento-tile" data-pillar="5">
          <div class="tile-top"><span>Module 5</span><span class="tile-progress">9 Sub-Modules</span></div>
          <div class="tile-body">
            <h3 class="tile-title">Safety, Ethics &amp; Legal</h3>
            <p class="tile-desc">Protecting yourself, your sources, and your judgment.</p>
          </div>
          <span class="tile-cta">View modules <span class="chevron">›</span></span>
        </button>
        <div class="inline-panel" id="inline-5"><div class="inline-inner"><div class="inline-content"></div></div></div>
      </div>
    </div>

    <div class="module-sidepanel" id="sidePanel">
      <div class="sidepanel-empty" id="sidepanelEmpty">Select a module on the left to view its contents here.</div>
      <div class="sidepanel-content" id="sidepanelContent"></div>
    </div>
  </div>
</section>

<footer>CANOPY — ENVIRONMENTAL JOURNALISM TOOLKIT</footer>

<script>
  /* ---------- Kinetic title ---------- */
  const titleEl = document.getElementById('kineticTitle');
  "CANOPY".split('').forEach((ch, i) => {
    const span = document.createElement('span');
    span.className = 'letter';
    span.style.animationDelay = (i * 0.06) + 's';
    span.textContent = ch;
    titleEl.appendChild(span);
  });

  const subEl = document.getElementById('heroSub');
  const subText = "A field toolkit for environmental journalists working in Bangladesh.";
  subText.split(' ').forEach((w, i) => {
    const span = document.createElement('span');
    span.className = 'word';
    span.style.animationDelay = (0.7 + i * 0.05) + 's';
    span.textContent = w + '\u00A0';
    subEl.appendChild(span);
  });

  /* ---------- Scroll reveal ---------- */
  const revealTargets = document.querySelectorAll('.section-kinetic');
  const revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
      }
    });
  }, { threshold:0.4 });
  revealTargets.forEach(t => revealObserver.observe(t));

  /* (stat counters removed) */

  /* ---------- Parallax canopy layers ---------- */
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reducedMotion){
    const layers = document.querySelectorAll('.leaf-layer');
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      layers.forEach(layer => {
        const speed = parseFloat(layer.dataset.speed);
        layer.style.transform = `translateY(${y * speed}px)`;
      });
    }, { passive:true });
  }

  /* ---------- Bento data + dossier ---------- */
  const pillarData = {
    1: { title:'Core Craft & Storytelling', chapters:[
        {name:'Ch.1 — What Makes an Environmental Story', modules:[
          {code:'1.1', title:'Environmental News Values', level:'Foundations', status:'filed', href:'1.1.1.html'},
          {code:'1.2', title:'Episodic vs. Thematic Framing', level:'Foundations', status:'filed', href:'1.1.2.html'},
          {code:'1.3', title:'The Beat Beyond the Desk', level:'Foundations', status:'filed', href:'1.1.3.html'}
        ]},
        {name:'Ch.2 — Translating Science for the Public', modules:[
          {code:'2.1', title:'Reading and Trusting Scientific Sources', level:'Foundations', status:'filed', href:'1.2.1.html'},
          {code:'2.2', title:'Communicating Risk and Uncertainty', level:'Field Craft', status:'filed', href:'1.2.2.html'},
          {code:'2.3', title:'Avoiding False Balance', level:'Field Craft', status:'filed', href:'1.2.3.html'}
        ]},
        {name:'Ch.3 — Narrative Craft & Humanizing Data', modules:[
          {code:'3.1', title:'From Statistic to Scene', level:'Field Craft', status:'filed', href:'1.3.1.html'},
          {code:'3.2', title:'Character and Voice in Environmental Stories', level:'Field Craft', status:'filed', href:'1.3.2.html'},
          {code:'3.3', title:'Structure for Long-Form Narrative', level:'Advanced', status:'filed', href:'1.3.3.html'}
        ]},
        {name:'Ch.4 — Story Architecture & Formats', modules:[
          {code:'4.1', title:'The Nut Graf and Story Contracts', level:'Foundations', status:'filed', href:'1.4.1.html'},
          {code:'4.2', title:'Choosing Your Format', level:'Field Craft', status:'filed', href:'1.4.2.html'},
          {code:'4.3', title:'Explainer Craft', level:'Foundations', status:'filed', href:'1.4.3.html'}
        ]},
        {name:'Ch.5 — Interviewing Across Power Gradients', modules:[
          {code:'5.1', title:'Interviewing Scientists and Technical Experts', level:'Field Craft', status:'filed', href:'1.5.1.html'},
          {code:'5.2', title:'Interviewing Officials and Institutions', level:'Field Craft', status:'filed', href:'1.5.2.html'},
          {code:'5.3', title:'Interviewing Affected Communities', level:'Advanced', status:'filed', href:'1.5.3.html'}
        ]},
        {name:'Ch.6 — Solutions-Oriented Reporting', modules:[
          {code:'6.1', title:"Reporting What's Working, Not Just What's Broken", level:'Field Craft', status:'filed', href:'1.6.1.html'},
          {code:'6.2', title:'Balancing Accountability and Hope', level:'Advanced', status:'filed', href:'1.6.2.html'}
        ]},
        {name:'Ch.7 — Visual & Immersive Storytelling', modules:[
          {code:'7.1', title:'Photography and Video for Environmental Stories', level:'Field Craft', status:'filed', href:'1.7.1.html'},
          {code:'7.2', title:'Data Visualization for Narrative', level:'Field Craft', status:'filed', href:'1.7.2.html'},
          {code:'7.3', title:'Scrollytelling and Interactive Formats', level:'Advanced', status:'filed', href:'1.7.3.html'}
        ]}
    ]},
    2: { title:'Story Ideas, Beats & Explainers', chapters:[
        {name:'Ch.1 — Bangladesh Beat Map', modules:[
          {code:'1.1', title:'Rivers, Water & Encroachment', level:'Foundations', status:'filed', href:'2.1.1.html'},
          {code:'1.2', title:'Air Quality & Urban Pollution', level:'Foundations', status:'filed', href:'2.1.2.html'},
          {code:'1.3', title:'Climate Adaptation & Displacement', level:'Field Craft', status:'filed', href:'2.1.3.html'},
          {code:'1.4', title:'The Sundarbans & Biodiversity', level:'Field Craft', status:'filed', href:'2.1.4.html'},
          {code:'1.5', title:'Industrial & Occupational Environment Beats', level:'Field Craft', status:'filed', href:'2.1.5.html'},
          {code:'1.6', title:'Disasters: Floods & Cyclones', level:'Field Craft', status:'filed', href:'2.1.6.html'},
          {code:'1.7', title:'Waste, Energy & Agriculture', level:'Field Craft', status:'filed', href:'2.1.7.html'}
        ]},
        {name:'Ch.2 — Localizing Global Stories', modules:[
          {code:'2.1', title:'The Localization Method', level:'Field Craft', status:'filed', href:'2.2.1.html'},
          {code:'2.2', title:'Climate Finance & Loss and Damage', level:'Advanced', status:'filed', href:'2.2.2.html'},
          {code:'2.3', title:'Carbon Markets Explained', level:'Advanced', status:'filed', href:'2.2.3.html'}
        ]},
        {name:'Ch.3 — Explainer Bank & Story Ideation', modules:[
          {code:'3.1', title:'Building a Reusable Explainer Bank', level:'Foundations', status:'filed', href:'2.3.1.html'},
          {code:'3.2', title:'Story-Idea Prompt Bank & Seasonal Calendar', level:'Foundations', status:'filed', href:'2.3.2.html'},
          {code:'3.3', title:'Pitch Development', level:'Field Craft', status:'filed', href:'2.3.3.html'}
        ]}
    ]},
    3: { title:'Data & Investigative Methods', chapters:[
        {name:'Ch.1 — Finding, Reading & Vetting Data', modules:[
          {code:'1.1', title:'Where Environmental Data Lives', level:'Foundations', status:'filed', href:'3.1.1.html'},
          {code:'1.2', title:'Assessing Dataset Reliability', level:'Field Craft', status:'filed', href:'3.1.2.html'},
          {code:'1.3', title:'From Dataset to Story Lead', level:'Field Craft', status:'filed', href:'3.1.3.html'}
        ]},
        {name:'Ch.2 — Satellite & Remote-Sensing Tools', modules:[
          {code:'2.1', title:'Air Quality Monitoring Tools', level:'Field Craft', status:'filed', href:'3.2.1.html'},
          {code:'2.2', title:'Satellite Imagery for Change Detection', level:'Advanced', status:'filed', href:'3.2.2.html'},
          {code:'2.3', title:'Forest & Land-Use Tracking', level:'Advanced', status:'filed', href:'3.2.3.html'},
          {code:'2.4', title:'Fire & Disaster Tracking', level:'Field Craft', status:'filed', href:'3.2.4.html'}

  const sidePanel = document.getElementById('sidePanel');
  const sidepanelEmpty = document.getElementById('sidepanelEmpty');
  const sidepanelContent = document.getElementById('sidepanelContent');
  const tiles = document.querySelectorAll('.bento-tile');
  const desktopQuery = window.matchMedia('(min-width: 900px)');
  let activeId = null;

  function buildRegisterHTML(id){
    const p = pillarData[id];
    let html = `<div class="dossier-head">
      <span class="dossier-num">Module ${id}</span>
      <h3 class="dossier-title">${p.title}</h3>
    </div>`;
    p.chapters.forEach(ch => {
      html += `<div class="chapter-block"><p class="chapter-name">${ch.name}</p>`;
      ch.modules.forEach(m => {
        const fullCode = `${id}.${m.code}`;
        if(m.status === 'filed'){
          html += `<a class="mod-row" href="${m.href}">
            <span class="mod-code">${fullCode}</span>
            <span class="mod-title">${m.title}</span>
            <span class="mod-level">${m.level}</span>
          </a>`;
        } else {
          html += `<div class="mod-row">
            <span class="mod-code">${fullCode}</span>
            <span class="mod-title">${m.title}</span>
            <span class="mod-level">${m.level}</span>
          </div>`;
        }
      });
      html += `</div>`;
    });
    return html;
  }

  tiles.forEach(tile => {
    tile.addEventListener('click', () => {
      const id = tile.dataset.pillar;
      const item = tile.closest('.module-item');
      const inlinePanel = item.querySelector('.inline-panel');
      const inlineContent = item.querySelector('.inline-content');

      if(desktopQuery.matches){
        // Desktop: render into the persistent right-side panel
        if(activeId === id){
          tiles.forEach(t => t.classList.remove('is-active'));
          sidepanelContent.innerHTML = '';
          sidepanelEmpty.style.display = 'block';
          activeId = null;
          return;
        }
        tiles.forEach(t => t.classList.remove('is-active'));
        tile.classList.add('is-active');
        sidepanelContent.innerHTML = buildRegisterHTML(id);
        sidepanelEmpty.style.display = 'none';
        activeId = id;
      } else {
        // Mobile: toggle this tile's own inline panel, closing any other open one
        const alreadyOpen = inlinePanel.classList.contains('is-open');
        document.querySelectorAll('.inline-panel.is-open').forEach(p => p.classList.remove('is-open'));
        tiles.forEach(t => t.classList.remove('is-active'));
        if(!alreadyOpen){
          if(!inlineContent.dataset.rendered){
            inlineContent.innerHTML = buildRegisterHTML(id);
            inlineContent.dataset.rendered = 'true';
          }
          inlinePanel.classList.add('is-open');
          tile.classList.add('is-active');
          activeId = id;
          setTimeout(() => {
            item.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block:'nearest' });
          }, 250);
        } else {
          activeId = null;
        }
      }
    });
  });
</script>
